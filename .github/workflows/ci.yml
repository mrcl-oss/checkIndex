name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Temporarily disabled: golangci-lint's type checker cannot read Go 1.27.3
  # export data (version 5) yet. Re-enable after an upstream-compatible release.
  # lint:
  #   name: Lint
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
